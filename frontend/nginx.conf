# ---------------------------------------------------------------------
# nginx внутри контейнера фронтенда.
#
# Его задача проста: отдать собранные файлы Vite. HTTPS, домен и заголовки
# безопасности берёт на себя edge-caddy, поэтому здесь ничего этого нет —
# иначе заголовки задвоятся.
# ---------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Адреса вида /tests/12/results и /t/abc1234 существуют только в браузере:
    # файлов с такими именами нет. Поэтому любой неизвестный путь отдаём
    # index.html, а маршрут разбирает уже React. Без этого перезагрузка
    # страницы или переход по ссылке давали бы 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Файлы сборки: имя каждого содержит хеш содержимого, поэтому их можно
    # кешировать надолго — при изменении меняется имя.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html кешировать нельзя: иначе браузер будет держать старую версию
    # приложения и ссылаться на уже удалённые файлы сборки.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Чуть меньше трафика на школьном интернете.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Версию nginx наружу не показываем.
    server_tokens off;
}
